<script>
    // JS для имитации графика
    document.addEventListener('DOMContentLoaded', function() {
        const lineChartCanvas = document.getElementById('lineChart');
        if (!lineChartCanvas) return;
        const ctx = lineChartCanvas.getContext('2d');
        
        const data = [10, 20, 15, 25, 20, 30, 28];
        const labels = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        const width = lineChartCanvas.width;
        const height = lineChartCanvas.height;

        ctx.clearRect(0, 0, width, height);

        ctx.lineWidth = 2;
        ctx.strokeStyle = 'var(--primary-orange)';
        ctx.fillStyle = 'rgba(255, 107, 74, 0.2)';

        // Draw line
        ctx.beginPath();
        ctx.moveTo(0, height - (data[0] / 30) * height);
        for (let i = 1; i < data.length; i++) {
            const x = (i / (data.length - 1)) * width;
            const y = height - (data[i] / 30) * height;
            ctx.lineTo(x, y);
        }
        ctx.stroke();

        // Draw fill area
        ctx.lineTo(width, height);
        ctx.lineTo(0, height);
        ctx.closePath();
        ctx.fill();

        // Draw data points
        for (let i = 0; i < data.length; i++) {
            const x = (i / (data.length - 1)) * width;
            const y = height - (data[i] / 30) * height;
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = 'var(--primary-orange)';
            ctx.fill();
        }
    });
</script>
