{% load flights_extras %}
{% load crispy_forms_tags %}

<form method="post" id="service-form" class="space-y-4">
    {% csrf_token %}
    <input type="hidden" name="service_id" id="service-id-input">
    
    <!-- Используем Tailwind CSS для стилизации полей формы -->
    {% for field in form %}
        <div class="flex flex-col">
            <label for="{{ field.id_for_label }}" class="text-sm font-semibold text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
                <span class="text-xs text-gray-500 mt-1">{{ field.help_text }}</span>
            {% endif %}
            {% for error in field.errors %}
                <span class="text-red-500 text-xs mt-1">{{ error }}</span>
            {% endfor %}
        </div>
    {% endfor %}

    <div class="flex space-x-2">
        <button type="submit" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-xl transition-colors duration-200">
            Сохранить
        </button>
        <button type="button" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded-xl transition-colors duration-200" id="cancel-edit-btn" style="display:none;">
            Отмена
        </button>
    </div>
</form>

<script>
    // JS для скрытия/показа формы
    document.getElementById('add-service-btn').addEventListener('click', function() {
        const formContainer = document.getElementById('service-form-container');
        formContainer.classList.remove('hidden');
    });

    document.getElementById('cancel-edit-btn').addEventListener('click', function() {
        const formContainer = document.getElementById('service-form-container');
        formContainer.classList.add('hidden');
    });
</script>
