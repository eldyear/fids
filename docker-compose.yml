services:
  db:
    image: postgres:16-alpine
    container_name: fids_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oss_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_this}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fids_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  fids_go:
    build:
      context: ./fids_go_v2.1
      dockerfile: Dockerfile
    container_name: fids_go
    restart: always
    ports:
      - "8085:8085"
      - "8082:8082"
    environment:
      FLIGHT_API_URL: ${FLIGHT_API_URL}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      TZ: Asia/Bishkek
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - fids_network

  easylock:
    build:
      context: ./easy_lock
      dockerfile: Dockerfile
    container_name: easylock_app
    restart: always
    volumes:
      - ./easy_lock/data:/app/data
    networks:
      - fids_network
    # Порт 8080 внутри контейнера, пробросим его для прямого теста
    ports:
      - "8081:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fids_backend
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      POSTGRES_DB: ${POSTGRES_DB:-oss_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_this}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLIGHT_API_URL: ${FLIGHT_API_URL:-https://api.example.com/flights}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/staticfiles
      - ./media:/app/media
    networks:
      - fids_network
    command: gunicorn oss.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import requests; resp=requests.get('http://localhost:8000/', timeout=5); exit(0 if resp.status_code < 500 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: fids_nginx
    depends_on:
      - backend
      - fids_go
      - easylock
    ports:
      - "80:80"
      - "443:443" # ОТКРЫВАЕМ ПОРТ 443
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro   # Папка с сертификатами
      - ./certbot/www:/var/www/certbot:ro    # Папка для проверки Let's Encrypt
      # - ./html:/usr/share/nginx/html
    networks:
      - fids_network
    restart: always

  certbot:
    image: certbot/certbot
    container_name: fids_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - fids_network

  databasus:
    container_name: databasus
    image: databasus/databasus:latest
    network_mode: host
    # ports:
    #   - "4005:4005"
    volumes:
      - ./databasus-data:/databasus-data
    restart: unless-stopped

  netmon:
    build:
      context: ./netmon
      dockerfile: Dockerfile
    container_name: netmon
    restart: unless-stopped
    networks:
      - fids_network
    ports:
      - "5002:5000"
    volumes:
      - netmon_data:/data
    environment:
      DB_PATH: /data/netmon.db
      CHECK_INTERVAL: 10 # интервал проверки, секунды
      PING_HOST: 8.8.8.8 # основной ping-хост
      PING_HOST2: 1.1.1.1 # резервный ping-хост
      HTTP_URL: http://connectivitycheck.gstatic.com/generate_204 # HTTP-проверка интернета
      HTTP_URL2: http://www.msftconnecttest.com/connecttest.txt # резервная HTTP-проверка


volumes:
  postgres_data:
    driver: local
  netmon_data:
    driver: local

networks:
  fids_network:
    driver: bridge
