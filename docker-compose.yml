services:
  db:
    image: postgres:16-alpine
    container_name: fids_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oss_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_this}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fids_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  fids_go:
    build:
      context: ./fids_go_v2.1
      dockerfile: Dockerfile
    container_name: fids_go
    ports:
      - "8085:8085"
    environment:
      FLIGHT_API_URL: ${FLIGHT_API_URL:-http://31.192.250.185/api/fids_full.json}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    networks:
      - fids_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fids_backend
    environment:
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      POSTGRES_DB: ${POSTGRES_DB:-oss_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_this}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FLIGHT_API_URL: ${FLIGHT_API_URL:-https://api.example.com/flights}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./static:/app/staticfiles
      - ./media:/app/media
    networks:
      - fids_network
    command: gunicorn oss.wsgi:application --bind 0.0.0.0:8000 --workers 3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "python -c \"import requests; resp=requests.get('http://localhost:8000/', timeout=5); exit(0 if resp.status_code < 500 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: fids_nginx
    depends_on:
      - backend
      - fids_go
    ports:
      - "80:80"
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    networks:
      - fids_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
    driver: local

networks:
  fids_network:
    driver: bridge
