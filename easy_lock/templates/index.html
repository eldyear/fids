<!DOCTYPE html>
<html>

<head>
    <title>ReadyBoard Admin</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f4f4f9;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 50px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
        }

        .btn-add {
            background: #28a745;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
            margin: 20px;
        }

        .locked {
            color: red;
        }

        .unlocked {
            color: green;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Управление Симулятором</h1>
        <div class="status {{if .IsLocked}}locked{{else}}unlocked{{end}}">
            Статус: {{if .IsLocked}}ЗАБЛОКИРОВАНО{{else}}РАЗБЛОКИРОВАНО{{end}}
        </div>
        <p>Осталось времени: <strong>{{.RemainingTime}}</strong> сек.</p>

        <form action="/add" method="GET">
            <input type="number" name="seconds" value="60" style="padding: 10px; width: 60px;">
            <button type="submit" class="btn btn-add">+ Добавить секунды</button>
        </form>
        <br>
        <button onclick="location.reload()" class="btn" style="background: #007bff;">Обновить данные</button>
    </div>
</body>

</html>
