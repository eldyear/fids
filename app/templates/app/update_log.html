<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал обновлений</title>
</head>
<body>
    <h2>Журнал обновлений рейсов</h2>

    {% if log_entries %}
        <ul>
            {% for entry in log_entries %}
                <li>{{ entry.timestamp }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Журнал обновлений пуст.</p>
    {% endif %}

    <a href="{% url 'update_flights' %}">Назад к обновлению</a>
</body>
</html>
