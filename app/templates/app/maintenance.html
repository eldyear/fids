<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSS.KG | Информационная система</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            /* border: 1px solid #30363d; */
            padding: 3rem;
            border-radius: 12px;
            background: #0d1117;
            /* box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); */
        }

        .logo {
            font-size: 3rem;
            font-weight: 700;
            color: #58a6ff;
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #238636;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px #238636;
        }

        .info {
            font-size: 1rem;
            color: #8b949e;
            line-height: 1.6;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #484f58;
        }

        hr {
            border: 0;
            border-top: 1px solid #30363d;
            margin: 1.5rem 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">OSS.KG</div>
        <div><span class="status-dot"></span> System Online</div>
        <hr>
        <div class="info">
            <p>Ошская Информационная Система (FIDS/OSS)</p>
            <p>Доступ к панели управления ограничен.<br>Авторизуйтесь для продолжения работы.</p>
        </div>
        <div class="footer">
            &copy; 2026 IT Support Osh Airport
        </div>
    </div>
</body>

</html>
