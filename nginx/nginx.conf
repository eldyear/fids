user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # --- UPSTREAM сервисы ---
    upstream django { server backend:8000; }
    upstream golang_fids { server fids_go:8085; }
    upstream golang_easylock { server easylock:8080; }

    # --- 1. СЕКЦИЯ HTTP (Порт 80) ---
    server {
        listen 80;
        server_name oss.kg www.oss.kg 199.1.1.3 192.168.15.190 172.20.0.1 localhost 31.192.250.180;

        client_max_body_size 100M;

        # Для проверки Certbot (оставляем для автопродления)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ТАБЛО FIDS (ЛОКАЛКА по HTTP)
        location /go/ {
            proxy_pass http://golang_fids/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/conf.d/proxy_params;
            proxy_read_timeout 86400;
        }

        # EASYLOCK (ЛОКАЛКА по HTTP)
        location /easylock/ {
            proxy_pass http://golang_easylock/;
            include /etc/nginx/conf.d/proxy_params;
        }

        # КОРЕНЬ / DJANGO
        location / {
            # Если зашли через домен — принудительно на HTTPS
            if ($host = "oss.kg") { return 301 https://$host$request_uri; }
            if ($host = "www.oss.kg") { return 301 https://$host$request_uri; }
            
            # Если по IP — работаем по HTTP
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params;
        }
        
        location /health {
            access_log off;
            return 200 "OK\n";
        }
    }

    # --- 2. СЕКЦИЯ HTTPS (Порт 443) ---
    server {
        listen 443 ssl; # ВКЛЮЧЕНО
        server_name oss.kg www.oss.kg;

        # СЕРТИФИКАТЫ
        ssl_certificate /etc/letsencrypt/live/oss.kg/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/oss.kg/privkey.pem;

        # НАСТРОЙКИ БЕЗОПАСНОСТИ
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 100M;

        # --- EASYLOCK ---
        location /easylock/ {
            proxy_pass http://golang_easylock/;
            include /etc/nginx/conf.d/proxy_params;
        }

        # --- FIDS (Табло через интернет) ---
        location /go/ {
            proxy_pass http://golang_fids/;
            proxy_redirect http://golang_fids/ /go/;
            proxy_redirect / /go/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/conf.d/proxy_params;
            proxy_read_timeout 86400;
        }

        # --- DJANGO ---
        location /admin {
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params;
        }

        location /api/ {
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params;
        }

        # --- СТАТИКА ---
        location /static/ {
            alias /app/static/;
        }

        location /media/ {
            alias /app/media/;
        }

        # КОРЕНЬ
        location / {
            proxy_pass http://django;
            include /etc/nginx/conf.d/proxy_params;
        }
    }
}